<div
  class="toast-region"
  role="region"
  aria-live="polite"
  [attr.aria-label]="'toast.regionLabel' | transloco"
>
  @for (message of toast.messages(); track message.id) {
    <article class="toast" [attr.data-tone]="message.tone">
      <p>{{ message.message }}</p>
      <button
        class="toast__close"
        type="button"
        [attr.aria-label]="'actions.close' | transloco"
        (click)="toast.dismiss(message.id)"
      >
        <span aria-hidden="true">×</span>
      </button>
    </article>
  }
</div>
