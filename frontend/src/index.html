<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow - управление задачами</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="TaskFlow - пространства, доски и задачи без лишней сложности."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/taskflow-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (() => {
        const themeKey = 'taskflow.theme';
        const languageKey = 'taskflow.language';

        try {
          const storedTheme = localStorage.getItem(themeKey);
          const mode =
            storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system'
              ? storedTheme
              : 'system';
          const resolvedTheme =
            mode === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          const storedLanguage = localStorage.getItem(languageKey);
          const language =
            storedLanguage === 'ru' || storedLanguage === 'en'
              ? storedLanguage
              : navigator.language.toLowerCase().startsWith('ru')
                ? 'ru'
                : 'en';

          document.documentElement.dataset['theme'] = resolvedTheme;
          document.documentElement.style.colorScheme = resolvedTheme;
          document.documentElement.lang = language;
        } catch {}
      })();
    </script>
    <style>
      html[data-theme='dark'] {
        --tf-primary: #6aac6a;
        --tf-primary-hover: #82bc82;
        --tf-primary-soft: #263b2b;
        --tf-canvas: #202124;
        --tf-surface: #292a2d;
        --tf-surface-muted: #323438;
        --tf-foreground: #f1f3f4;
        --tf-muted: #bdc1c6;
        --tf-border: #45474d;
        --tf-danger: #f28b82;
        --tf-warning: #fdd663;
        --tf-success: #81c995;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
