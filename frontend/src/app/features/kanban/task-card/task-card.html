<article
  class="task-card"
  [class.task-card--completed]="task().isCompleted"
  [class.task-card--pending]="pending()"
  [attr.aria-busy]="pending()"
>
  <button class="task-card__body" type="button" (click)="edit.emit()">
    <span class="task-card__priority" [attr.data-priority]="task().priority">
      {{ 'kanban.priority.' + task().priority | transloco }}
    </span>
    <strong>{{ task().title }}</strong>
    @if (pending()) {
      <small class="task-card__pending">{{ 'kanban.pending' | transloco }}</small>
    }
    @if (task().description) {
      <p>{{ task().description }}</p>
    }
    @if (task().labels?.length) {
      <span class="task-card__labels">
        @for (label of task().labels; track label) {
          <span>{{ label }}</span>
        }
      </span>
    }
    <span class="task-card__meta">
      @if (task().dueDate) {
        <span>{{ 'kanban.task.due' | transloco }}: {{ task().dueDate | localizedDate }}</span>
      }
      @if (task().assignee?.name || task().assigneeName) {
        <span>{{ task().assignee?.name || task().assigneeName }}</span>
      }
    </span>
  </button>

  @if (canEdit()) {
    <div class="task-card__actions">
      <app-button variant="ghost" [disabled]="busy()" (pressed)="toggleCompleted.emit()">
        {{ (task().isCompleted ? 'kanban.task.reopen' : 'kanban.task.complete') | transloco }}
      </app-button>
      @if (canReorder()) {
        <app-button variant="ghost" [disabled]="busy() || index() === 0" (pressed)="moveUp.emit()">
          {{ 'kanban.task.up' | transloco }}
        </app-button>
        <app-button
          variant="ghost"
          [disabled]="busy() || index() === count() - 1"
          (pressed)="moveDown.emit()"
        >
          {{ 'kanban.task.down' | transloco }}
        </app-button>
      }
      <div class="task-card__move">
        <label class="task-card__move-label" [for]="'task-column-' + task().id">
          {{ 'kanban.task.moveTo' | transloco }}
        </label>
        <tui-textfield
          tuiTextfieldSize="m"
          [stringify]="stringifyColumn"
          [tuiTextfieldCleaner]="false"
        >
          <select
            tuiSelect
            [id]="'task-column-' + task().id"
            [items]="columnIds()"
            [ngModel]="task().columnId"
            [ngModelOptions]="{ standalone: true }"
            [disabled]="busy()"
            (ngModelChange)="selectColumnId($event)"
          ></select>
        </tui-textfield>
      </div>
      <app-button variant="danger" [disabled]="busy()" (pressed)="remove.emit()">
        {{ 'kanban.task.delete.action' | transloco }}
      </app-button>
    </div>
  }
</article>
