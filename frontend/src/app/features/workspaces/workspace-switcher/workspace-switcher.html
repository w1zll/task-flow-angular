<tui-textfield
  tuiTextfieldSize="m"
  class="switcher"
  [stringify]="stringifyWorkspace"
  [tuiTextfieldCleaner]="false"
>
  <label tuiLabel class="switcher__label">{{ 'workspaces.switcher.label' | transloco }}</label>
  <select
    tuiSelect
    [items]="workspaceIds()"
    [ngModel]="activeId()"
    [ngModelOptions]="{ standalone: true }"
    [attr.aria-label]="'workspaces.switcher.label' | transloco"
    (ngModelChange)="selectWorkspaceId($event)"
  ></select>
</tui-textfield>
