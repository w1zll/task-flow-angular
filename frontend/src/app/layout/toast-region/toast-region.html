<div
  class="toast-region"
  role="region"
  aria-live="polite"
  [attr.aria-label]="'toast.regionLabel' | transloco"
>
  @for (message of toast.messages(); track message.id) {
    <article tuiNotification class="toast" size="m" [appearance]="appearance(message.tone)">
      <p>{{ message.message }}</p>
      <button
        tuiButton
        appearance="flat"
        size="s"
        type="button"
        [attr.aria-label]="'actions.close' | transloco"
        (click)="toast.dismiss(message.id)"
      >
        ×
      </button>
    </article>
  }
</div>
