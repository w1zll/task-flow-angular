<header class="header">
  <div class="header__inner">
    <a class="brand" routerLink="/" aria-label="TaskFlow">
      <img
        class="brand__mark"
        src="/icons/taskflow-icon.svg"
        width="36"
        height="36"
        alt=""
        aria-hidden="true"
      />
      <span>TaskFlow</span>
    </a>

    <div class="header__actions">
      <nav class="auth-nav" [attr.aria-label]="'header.authNavigation' | transloco">
        @if (!auth.hydrated()) {
          <span class="auth-loading" aria-hidden="true"></span>
        } @else if (auth.user(); as user) {
          <a tuiButton appearance="flat" size="s" class="auth-link" routerLink="/workspaces">
            {{ 'header.workspaces' | transloco }}
          </a>
          <span class="auth-user" [title]="user.name">{{ user.name }}</span>
          <button
            tuiButton
            appearance="primary"
            size="s"
            class="auth-link auth-link--primary"
            type="button"
            [disabled]="auth.status() === 'loading'"
            (click)="logout()"
          >
            {{ 'header.logout' | transloco }}
          </button>
        } @else {
          <a tuiButton appearance="flat" size="s" class="auth-link" routerLink="/auth/login">
            {{ 'header.login' | transloco }}
          </a>
          <a
            tuiButton
            appearance="primary"
            size="s"
            class="auth-link auth-link--primary"
            routerLink="/auth/register"
          >
            {{ 'header.register' | transloco }}
          </a>
        }
      </nav>

      <div class="preferences">
        <tui-textfield
          tuiTextfieldSize="m"
          class="preference"
          [stringify]="stringifyLanguage"
          [tuiTextfieldCleaner]="false"
        >
          <select
            tuiSelect
            class="preference__select"
            [items]="languages"
            [ngModel]="locale.language()"
            [ngModelOptions]="{ standalone: true }"
            [attr.aria-label]="'header.language' | transloco"
            (ngModelChange)="setLanguage($event)"
          ></select>
        </tui-textfield>

        <tui-textfield
          tuiTextfieldSize="m"
          class="preference"
          [stringify]="stringifyTheme"
          [tuiTextfieldCleaner]="false"
        >
          <select
            tuiSelect
            class="preference__select preference__select--theme"
            [items]="themes"
            [ngModel]="theme.mode()"
            [ngModelOptions]="{ standalone: true }"
            [attr.aria-label]="'header.theme' | transloco"
            (ngModelChange)="setTheme($event)"
          ></select>
        </tui-textfield>
      </div>
    </div>
  </div>
</header>
