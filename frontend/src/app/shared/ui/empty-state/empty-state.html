<tui-block-status class="state" size="l">
  <div tuiSlot="top" class="state__icon" aria-hidden="true">
    <ng-content select="[empty-state-icon]" />
  </div>
  <h2 class="state__title">{{ title() }}</h2>
  @if (description()) {
    <p class="state__description">{{ description() }}</p>
  }
  <ng-content />
</tui-block-status>
