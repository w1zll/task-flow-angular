<tui-root [attr.tuiTheme]="theme.resolvedTheme()">
  <a class="skip-link" href="#main-content">
    {{ 'a11y.skipToContent' | transloco }}
  </a>

  <app-header />
  <app-backend-status-banner [state]="backendBannerState()" (retry)="retryBackend()" />

  <div id="main-content" class="app-content" tabindex="-1">
    <router-outlet />
  </div>

  <app-toast-region />
</tui-root>
