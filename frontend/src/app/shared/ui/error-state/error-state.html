<tui-block-status class="error" size="l" role="alert">
  <span tuiSlot="top" class="error__mark" aria-hidden="true">!</span>
  <h2 class="error__title">{{ title() }}</h2>
  <p class="error__description">{{ description() }}</p>
  @if (retryLabel()) {
    <app-button variant="secondary" (pressed)="retry.emit()">
      {{ retryLabel() }}
    </app-button>
  }
</tui-block-status>
